name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: TypeFreeCore Unit Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run core package tests
        run: |
          set -o pipefail
          swift test --package-path Packages/TypeFreeCore 2>&1 | tee /tmp/swift-test.log

      - name: 失败摘要（页面底部直接可复制）
        if: failure()
        run: |
          echo "======== ERROR SUMMARY（复制本段即可）========"
          grep -nE "error:|FAILED|Failing tests|Assertion|XCTAssert" /tmp/swift-test.log | head -n 80 || true

  ios-build:
    name: Xcode Build (App + Keyboard Extension)
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project TypeFree.xcodeproj \
            -scheme TypeFree \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild-sim.log | tail -n 40

      - name: 失败摘要（Simulator 构建）
        if: failure()
        run: |
          echo "======== ERROR SUMMARY（复制本段即可）========"
          grep -nE " error:" /tmp/xcodebuild-sim.log | head -n 60 || true

      - name: Validate archive (generic iOS device, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TypeFree.xcodeproj \
            -scheme TypeFree \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild-device.log | tail -n 40

      - name: 失败摘要（真机构建）
        if: failure()
        run: |
          echo "======== ERROR SUMMARY（复制本段即可）========"
          grep -nE " error:" /tmp/xcodebuild-device.log | head -n 60 || true

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeFree-simulator-build
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/TypeFree.app
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/TypeFreeKeyboard.appex
          if-no-files-found: warn
