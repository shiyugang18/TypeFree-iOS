name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    name: TypeFreeCore Unit Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run core package tests
        run: |
          set -o pipefail
          swift test --package-path Packages/TypeFreeCore 2>&1 | tee /tmp/swift-test.log

      - name: 失败摘要（页面底部直接可复制）
        if: failure()
        run: |
          echo "======== ERROR SUMMARY（复制本段即可）========"
          grep -nE "error:|FAILED|Failing tests|Assertion|XCTAssert" /tmp/swift-test.log | head -n 80 || true

      # ::error:: 变成 check-run annotations，匿名 API 可读（job log 403 时的观测口）
      - name: 测试错误注入 annotations（匿名可读）
        if: failure()
        run: |
          grep -E "error:" /tmp/swift-test.log | sort -u | head -n 20 | while IFS= read -r line; do
            echo "::error::${line:0:800}"
          done
          exit 0

      - name: 失败日志外送到 ci-logs 分支
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p ci-logs-tmp
          { echo "# core-tests run ${GITHUB_RUN_ID} @ ${GITHUB_SHA}"
            echo
            echo '## grep 摘要'
            echo '```'
            grep -nE "error:|FAILED|Failing tests|Assertion|XCTAssert" /tmp/swift-test.log | head -n 100 || echo "(grep 无匹配)"
            echo '```'
            echo
            echo '## 日志尾部 300 行'
            echo '```'
            tail -n 300 /tmp/swift-test.log
            echo '```'
          } > ci-logs-tmp/REPORT-core-tests.md
          git config user.name "ci-log-bot"
          git config user.email "bot@typefree.local"
          git fetch origin ci-logs 2>/dev/null || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout -B ci-logs FETCH_HEAD
          else
            git checkout -B ci-logs
          fi
          mkdir -p core-tests
          cp ci-logs-tmp/REPORT-core-tests.md core-tests/REPORT.md
          git add -A
          git commit -m "ci log: core-tests run ${GITHUB_RUN_ID}" || true
          git push -f origin ci-logs

  ios-build:
    name: Xcode Build (App + Keyboard Extension)
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project TypeFree.xcodeproj \
            -scheme TypeFree \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild-sim.log | tail -n 40

      - name: 失败摘要（Simulator 构建）
        if: failure()
        run: |
          echo "======== ERROR SUMMARY（复制本段即可）========"
          grep -nE " error:" /tmp/xcodebuild-sim.log | head -n 60 || true

      # ::error:: 会变成 check-run annotations，匿名 API 即可读取（job log 403 时的唯一观测口）
      - name: 编译错误注入 annotations（匿名可读）
        if: failure()
        run: |
          for f in /tmp/xcodebuild-sim.log /tmp/xcodebuild-device.log; do
            [ -f "$f" ] || continue
            grep -E " error:" "$f" | sort -u | head -n 20 | while IFS= read -r line; do
              echo "::error::${line:0:800}"
            done
          done
          exit 0

      - name: Validate archive (generic iOS device, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TypeFree.xcodeproj \
            -scheme TypeFree \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild-device.log | tail -n 40

      - name: 失败摘要（真机构建）
        if: failure()
        run: |
          echo "======== ERROR SUMMARY（复制本段即可）========"
          grep -nE " error:" /tmp/xcodebuild-device.log | head -n 60 || true

      # 未签名真机包：Sideloadly / AltStore / 爱思助手 等工具可直接重签安装
      - name: 打包真机 unsigned IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "TypeFree.app" -path "*-iphoneos*" | head -n 1)
          echo "找到 APP: $APP"
          [ -n "$APP" ] || { echo "未找到 iphoneos TypeFree.app"; exit 1; }
          echo "--- PlugIns（应含键盘扩展）---"
          ls "$APP/PlugIns/" || true
          mkdir -p ipa-tmp/Payload
          cp -R "$APP" ipa-tmp/Payload/
          cd ipa-tmp && zip -qry ../TypeFree-unsigned.ipa Payload && cd ..
          ls -lh TypeFree-unsigned.ipa

      - name: Upload device IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeFree-device-ipa
          path: TypeFree-unsigned.ipa
          if-no-files-found: error

      - name: 失败日志外送到 ci-logs 分支
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p report-tmp
          { echo "# ios-build run ${GITHUB_RUN_ID} @ ${GITHUB_SHA}"
            echo
            echo '## Simulator 构建日志尾部'
            echo '```'
            tail -n 200 /tmp/xcodebuild-sim.log 2>/dev/null || echo "(无日志)"
            echo '```'
            echo
            echo '## 真机构建日志尾部'
            echo '```'
            tail -n 200 /tmp/xcodebuild-device.log 2>/dev/null || echo "(无日志)"
            echo '```'
          } > report-tmp/REPORT-ios-build.md
          git config user.name "ci-log-bot"
          git config user.email "bot@typefree.local"
          git fetch origin ci-logs 2>/dev/null || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout -B ci-logs FETCH_HEAD
          else
            git checkout -B ci-logs
          fi
          mkdir -p ios-build
          cp report-tmp/REPORT-ios-build.md ios-build/REPORT.md
          git add -A
          git commit -m "ci log: ios-build run ${GITHUB_RUN_ID}" || true
          git push -f origin ci-logs

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeFree-simulator-build
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/TypeFree.app
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/TypeFreeKeyboard.appex
          if-no-files-found: warn
